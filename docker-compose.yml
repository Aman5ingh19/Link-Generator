version: '3.8'

services:
  # ========================================================
  # Distributed Tracing Engine (Zipkin)
  # UI available at http://localhost:9411
  # ========================================================
  zipkin:
    image: openzipkin/zipkin:latest
    container_name: link_generator_zipkin
    restart: unless-stopped
    ports:
      - "9411:9411"
    environment:
      - STORAGE_TYPE=mem
    networks:
      - link_network

  # ========================================================
  # Backend API (Node.js + Express + Prisma + OpenTelemetry)
  # Communicates with cloud-hosted Aiven MySQL directly
  # ========================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: link_generator_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      # Cloud-hosted Aiven MySQL URL passed from root .env
      - DATABASE_URL=${DATABASE_URL}
      # In container networking, 'zipkin' resolves to the zipkin container IP
      - ZIPKIN_ENDPOINT=http://zipkin:9411/api/v2/spans
    depends_on:
      - zipkin
    networks:
      - link_network

  # ========================================================
  # Frontend Application (React + Vite + Nginx)
  # Accessible in browser at http://localhost:3000
  # ========================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: link_generator_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - link_network

networks:
  link_network:
    driver: bridge
